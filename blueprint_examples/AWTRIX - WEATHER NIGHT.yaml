        {{draw_moon(moon_phase,24,0)}}
      value_template: >-
        {{forecast['weather.forecast_home'].forecast |  map(attribute='templow')
        |  first | round}}
      color: |-
        {% set temp = value_template | float %}
        {% set t_min, t_max = -15, 35 %}
        {% set h_min, h_max = 240, 0 %}
        {% set t_clamped = [ [t_min, temp] | max, t_max ] | min %}
        {% set ratio = (t_clamped - t_min) / (t_max - t_min) %}
        {% set hue = (h_min + ratio * (h_max - h_min)) | int %}
        {% set h = hue / 360 %}
        {% set s = 1.0 %}
        {% set v = 1.0 %}
        {% set i = (h * 6) | int %}
        {% set f = h * 6 - i %}
        {% set p = v * (1 - s) %}
        {% set q = v * (1 - f * s) %}
        {% set t = v * (1 - (1 - f) * s) %}
        {% if i % 6 == 0 %} {% set r, g, b = v, t, p %}
        {% elif i == 1 %} {% set r, g, b = q, v, p %}
        {% elif i == 2 %} {% set r, g, b = p, v, t %}
        {% elif i == 3 %} {% set r, g, b = p, q, v %}
        {% elif i == 4 %} {% set r, g, b = t, p, v %}
        {% else %} {% set r, g, b = v, p, q %}
        {% endif %}
        #{{ "%02x%02x%02x" | format((r*255)|int, (g*255)|int, (b*255)|int) }}
    pre_actions:
      - target:
          entity_id:
            - weather.forecast_home
        data:
          type: daily
        response_variable: forecast
        action: weather.get_forecasts
    user_options:
      durationMs: 5000
      icon: "{{icons[states('weather.forecast_home')]}}"
      text: ""
      draw: |
        [
          {{moon_data}},
          ["text", {{9 if (value_template |abs) > 9 else 11}}, 1, "{{'+' if value_template > 0}}{{value_template}}°", "{{color}}"]
        ]
    awtrix_device:
      - 2faa32e4a139d6415f4a0dd7066f3704
    extra_triggers:
      - trigger: time_pattern
        minutes: /5
